<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SE Lab</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Navbar */
        nav {
            background-color: #1e293b;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* Center Content */
        .container {
            height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container h1 {
            font-size: 60px;
            color: #1e293b;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            nav {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
            }

            nav ul {
                gap: 15px;
            }

            .container h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">SE Lab</div>

        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main class="container" id="home">
        <h1>SE Lab</h1>
    </main>

</body>
</html>
